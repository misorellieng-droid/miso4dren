server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Atrás do proxy do EasyPanel o Nginx recebe HTTP puro: redirecionamentos
    # relativos evitam sair como http://...:80 e quebrar o HTTPS.
    absolute_redirect off;

    # Endereço antigo: dren.miso4apps.com.br/x -> miso4apps.com.br/dren/x
    if ($host = dren.miso4apps.com.br) {
        return 301 https://miso4apps.com.br/dren$request_uri;
    }

    # O app mora em /dren/ (build copiado para html/dren, vite base "/dren/").
    location = /dren {
        return 301 /dren/;
    }

    # Arquivos com hash: cache longo. Sem fallback: arquivo inexistente dá 404
    # em vez de devolver HTML (evita tela branca depois de um deploy).
    location ^~ /dren/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: rota que não é arquivo real cai no index.html do dren.
    location /dren/ {
        try_files $uri $uri/ /dren/index.html;
        add_header Cache-Control "no-cache";
    }

    # Se o proxy repassar o pedido SEM o prefixo /dren, ele é recolocado aqui.
    location / {
        rewrite ^/(.*)$ /dren/$1 last;
    }
}
